[General]
; Diagnostic log written to %TEMP%\bcd2000asio.log
;   0 = off (no file is written)
;   1 = on
; Applies the next time the driver is loaded (restart your DJ/DAW software).
Log=0

[Audio]
; Buffer size in samples offered to the host as the preferred size (at 44.1 kHz: 256 = 5.8 ms, 512 = 11.6 ms).
; Valid values: 128, 256, 512, 1024, 2048. Traktor has no buffer setting for ASIO drivers and uses this value.
; Applies the next time the driver is loaded (restart your DJ/DAW software). Smaller values lower the
; latency but need a faster response from your software: if you hear crackles, increase it again.
BufferSize=256

[MIDI]
; Jog wheel correction for the BCD2000.
; JogMode:
;   0 = no change (messages are passed through as they arrive)
;   1 = absolute to relative, "2's complement"  (0x01 = forward, 0x7F = backward)
;   2 = absolute to relative, 3Fh/41h           (0x41 = forward, 0x3F = backward)
;   3 = absolute to relative, "signed bit"      (0x01 = forward, 0x41 = backward)
;   4 = BCD2000 fix (default): the card sends 0x41 in one direction and 0x40 in the other;
;       0x40 becomes 0x3F, so Traktor in "Rel 3Fh/41h" mode goes both forward and backward
JogMode=4
; CC numbers of the jog wheels, separated by commas
JogCC=18,19
; 1 = also write the first 400 jog values to the log (only has an effect when Log=1)
JogLog=0
